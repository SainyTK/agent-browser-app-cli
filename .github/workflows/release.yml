name: Release

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run verify

      - name: Determine release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must use X.Y.Z format." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            tag="v${version}"
            prerelease="false"
            release_name="agent-browser-app ${tag} LTS"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              publish="false"
              echo "${tag} is already published. Bump package.json for the next LTS release."
            else
              publish="true"
            fi
          elif [[ "${GITHUB_REF_NAME}" == "preview" ]]; then
            tag="v${version}-preview.${GITHUB_RUN_NUMBER}"
            prerelease="true"
            release_name="agent-browser-app ${tag}"
            publish="true"
          else
            echo "Releases must run from main or preview." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-baseline
            runner: ubuntu-latest
          - target: bun-linux-arm64
            runner: ubuntu-24.04-arm
          - target: bun-darwin-x64
            runner: macos-15-intel
          - target: bun-darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release archive
        run: |
          sh scripts/build-release.sh \
            "${{ needs.validate.outputs.tag }}" \
            "${{ matrix.target }}" \
            dist

      - name: Verify executable version
        run: |
          expected="${{ needs.validate.outputs.tag }}"
          expected="${expected#v}"
          actual="$(dist/agent-browser-app --version)"
          test "$actual" = "$expected"
        shell: bash

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            release create "$TAG"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_NAME"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          else
            arguments+=(--latest)
          fi
          gh "${arguments[@]}"
